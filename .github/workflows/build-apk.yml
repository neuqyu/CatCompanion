name: Build installable Android APK

on:
  push:
    branches: [main, master, 'feature/ai-cat-cutout-v0.2', 'feature/v0.3-photo-motion-polish', 'hotfix/v0.3.1-ai-model-diagnostics']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Configure Gradle 8.13 (no wrapper required)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build signed debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Publish installable APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatCompanion-V0.3.1-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
